[project]
name = "sfms-chatbot"
version = "0.1.0"
description = "Natural-language Q&A over the UMT SFMS database"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "duckdb>=1.1",
    "groq>=0.11",
    "rapidfuzz>=3.9",
    "sqlglot>=25.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false
